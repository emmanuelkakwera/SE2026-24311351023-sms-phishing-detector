plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.moneyguardsms'
version = '0.1.0'

android {
  namespace "expo.modules.moneyguardsms"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
  sourceSets {
    main {
      // Reuse the single bundled model asset from the JS app.
      assets.srcDirs += file("$projectDir/../../../assets/model")
    }
  }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.15.0'
}
